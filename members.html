<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員管理 - Mono Climbing Studio</title>
<style>
:root {
  --accent: #e84c2c;
  --dark: #1a1a1a;
  --mid: #444;
  --light-bg: #f7f7f7;
  --card-bg: #ffffff;
  --border: #e0e0e0;
  --text: #222;
  --sub: #777;
  --success: #2e7d32;
  --radius: 10px;
  --store-bg: var(--light-bg);
}
body.store-hakata  { --store-bg: #f5f5f5; }
body.store-omura   { --store-bg: #b3e5fc; }
body.store-sasebo  { --store-bg: #c8e6c9; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--store-bg); color: var(--text); transition: background .3s; }

nav { background: var(--dark); display: flex; align-items: center; padding: 0 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
nav .logo { color: #fff; font-size: 0.8rem; font-weight: 700; letter-spacing: .05em; padding: 12px 12px 12px 0; margin-right: 8px; border-right: 1px solid #444; white-space: nowrap; }
nav a { color: #aaa; text-decoration: none; padding: 14px 14px; font-size: 0.85rem; border-bottom: 3px solid transparent; transition: all .15s; white-space: nowrap; }
nav a.active { color: #fff; border-bottom-color: var(--accent); }
nav a:hover { color: #fff; }

.page { max-width: 680px; margin: 0 auto; padding: 16px 14px 60px; }
.section { margin-bottom: 14px; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--dark); color: #fff; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-badge { padding: 3px 10px; border-radius: 100px; background: var(--dark); color: #fff; font-size: 0.75rem; font-weight: 700; }
.section-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.card { background: var(--card-bg); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }

/* Store tabs */
.store-tabs { display: flex; gap: 8px; }
.store-tab { flex: 1; padding: 11px 8px; border: 2px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.88rem; font-weight: 600; text-align: center; transition: all .15s; color: var(--mid); }
.store-tab.sel { background: var(--dark); color: #fff; border-color: var(--dark); }
.store-tab[data-store="hakata"].sel { background: #1a73e8; border-color: #1a73e8; }
.store-tab[data-store="omura"].sel  { background: #2e7d32; border-color: #2e7d32; }
.store-tab[data-store="sasebo"].sel { background: #e65100; border-color: #e65100; }
.store-tab:hover:not(.sel) { border-color: #aaa; }
.store-required-msg { margin-top: 8px; font-size: 0.8rem; color: var(--accent); font-weight: 600; display: none; }

/* Store indicator badge */
.store-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 100px;
  background: #eef; color: #334;
  font-size: 0.75rem; font-weight: 700;
  margin-left: auto;
}

/* Inputs */
.input-row { display: flex; gap: 8px; align-items: stretch; }
.input-row input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.92rem; outline: none; transition: border .15s; }
.input-row input:focus { border-color: var(--dark); }
.search-btn { padding: 0 18px; border: 1.5px solid var(--dark); border-radius: 8px; background: var(--dark); color: #fff; cursor: pointer; font-size: 0.88rem; white-space: nowrap; transition: opacity .15s; }
.search-btn:hover { opacity: .8; }
.result-box { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; display: none; }
.result-box.found { background: #e8f5e9; color: var(--success); display: block; }
.result-box.notfound { background: #f5f5f5; color: var(--sub); display: block; }

.field-label { font-size: 0.79rem; color: var(--sub); margin-bottom: 5px; font-weight: 500; }
.form-grid { display: grid; grid-template-columns: 140px 1fr; gap: 10px; margin-bottom: 12px; }
.full-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.92rem; outline: none; transition: border .15s; }
.full-input:focus { border-color: var(--dark); }
.action-btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 700; border: none; border-radius: var(--radius); cursor: pointer; transition: opacity .15s; }
.action-btn:hover { opacity: .88; }
.action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.msg-box { margin-top: 10px; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; display: none; }
.msg-box.ok { background: #e8f5e9; color: var(--success); display: block; }
.msg-box.err { background: #fdecea; color: #c62828; display: block; }

/* List */
.list-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.filter-input { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; transition: border .15s; }
.filter-input:focus { border-color: var(--dark); }
.reload-btn { padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.85rem; color: var(--mid); transition: all .15s; white-space: nowrap; }
.reload-btn:hover { border-color: var(--dark); background: var(--dark); color: #fff; }
.load-list-btn { width: 100%; padding: 13px; background: var(--dark); color: #fff; font-size: 0.92rem; font-weight: 700; border: none; border-radius: var(--radius); cursor: pointer; transition: opacity .15s; }
.load-list-btn:hover { opacity: .8; }
.member-count { font-size: 0.8rem; color: var(--sub); margin-bottom: 10px; font-weight: 500; }

table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
thead th { background: #f5f5f5; padding: 9px 12px; text-align: left; border-bottom: 2px solid var(--border); font-weight: 700; color: var(--mid); font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; }
tbody td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
tbody tr:hover td { background: #fafafa; }
tbody tr:last-child td { border-bottom: none; }
.code-cell { font-family: monospace; font-size: 0.9rem; font-weight: 700; color: var(--dark); }
.empty-state { text-align: center; padding: 40px 0; color: var(--sub); font-size: 0.88rem; }
.not-loaded-state { text-align: center; padding: 30px 0; color: var(--sub); font-size: 0.88rem; }

/* Row action buttons */
.row-actions { display: flex; gap: 6px; }
.row-edit-btn, .row-del-btn {
  padding: 5px 11px; font-size: 0.78rem; font-weight: 700;
  border-radius: 6px; cursor: pointer; border: 1.5px solid; transition: all .15s;
  white-space: nowrap;
}
.row-edit-btn { border-color: var(--dark); color: var(--dark); background: #fff; }
.row-edit-btn:hover { background: var(--dark); color: #fff; }
.row-del-btn { border-color: #e53935; color: #e53935; background: #fff; }
.row-del-btn:hover { background: #fdecea; }

/* Edit modal overlay */
#editModal {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.45);
  display: none; align-items: center; justify-content: center;
}
#editModal.open { display: flex; }
.modal-box {
  background: #fff; border-radius: 14px;
  padding: 28px 26px; width: 100%; max-width: 400px;
  box-shadow: 0 8px 40px rgba(0,0,0,.3);
}
.modal-title { font-size: 1rem; font-weight: 800; color: var(--dark); margin-bottom: 18px; }
.modal-field-label { font-size: 0.79rem; color: var(--sub); margin-bottom: 5px; font-weight: 500; }
.modal-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border .15s; margin-bottom: 14px; }
.modal-input:focus { border-color: var(--dark); }
.modal-btns { display: flex; gap: 10px; }
.modal-save-btn { flex: 1; padding: 12px; background: var(--accent); color: #fff; font-size: 0.92rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .15s; }
.modal-save-btn:hover { opacity: .88; }
.modal-cancel-btn { padding: 12px 18px; background: #fff; color: var(--mid); font-size: 0.92rem; font-weight: 600; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: all .15s; }
.modal-cancel-btn:hover { border-color: var(--dark); }
.modal-msg { margin-top: 10px; font-size: 0.85rem; font-weight: 600; min-height: 18px; }
.modal-msg.err { color: #c62828; }
.modal-msg.ok { color: var(--success); }

/* 履歴モーダル */
.row-hist-btn { border-color: #1a73e8; color: #1a73e8; background: #fff; }
.row-hist-btn:hover { background: #e8f0fe; }
#historyModal { position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 20px; }
#historyModal.open { display: flex; }
.hist-box { background:#fff; border-radius:14px; width:100%; max-width:1000px; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 8px 40px rgba(0,0,0,.35); overflow:hidden; }
.hist-head { padding:18px 22px 12px; border-bottom:1px solid var(--border); }
.hist-title { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.hist-name { font-size:1.1rem; font-weight:800; color:var(--dark); }
.hist-code { font-size:0.85rem; color:var(--sub); font-weight:600; }
.hist-store { font-size:0.78rem; background:#eef2f7; color:#1a5276; border-radius:100px; padding:3px 10px; font-weight:700; }
.hist-close { margin-left:auto; background:none; border:none; font-size:1.4rem; line-height:1; color:var(--sub); cursor:pointer; padding:0 4px; }
.hist-close:hover { color:var(--dark); }
.hist-summary { display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; }
.hs-item { background:#f7f9fc; border:1px solid var(--border); border-radius:8px; padding:8px 12px; min-width:110px; }
.hs-label { font-size:0.72rem; color:var(--sub); font-weight:600; }
.hs-value { font-size:1rem; font-weight:800; color:var(--dark); font-variant-numeric:tabular-nums; }
.hist-plans { margin-top:10px; font-size:0.8rem; color:var(--sub); }
.hist-plans .pl-tag { display:inline-block; background:#eef2f7; color:#1a5276; border-radius:4px; padding:2px 8px; margin:2px 4px 2px 0; font-weight:600; }
.hist-tabs { display:flex; gap:8px; padding:12px 22px 0; }
.hist-tab { padding:9px 16px; border:none; background:none; font-size:0.9rem; font-weight:700; color:var(--sub); cursor:pointer; border-bottom:3px solid transparent; }
.hist-tab.sel { color:var(--dark); border-bottom-color:var(--accent); }
.hist-body { padding:12px 22px 20px; overflow:auto; flex:1; }
.hist-body table { width:100%; border-collapse:collapse; font-size:0.84rem; min-width:680px; }
.hist-body thead th { position:sticky; top:0; background:#f5f5f5; padding:8px 10px; text-align:left; border-bottom:2px solid var(--border); font-size:0.75rem; color:var(--mid); font-weight:700; white-space:nowrap; }
.hist-body tbody td { padding:8px 10px; border-bottom:1px solid #f0f0f0; white-space:nowrap; }
.hist-body tbody tr:hover td { background:#fafafa; }
.hist-more { text-align:center; margin-top:14px; }
.hist-more button { padding:10px 22px; border:1.5px solid var(--border); border-radius:8px; background:#fff; color:var(--mid); font-size:0.86rem; font-weight:700; cursor:pointer; }
.hist-more button:hover { border-color:var(--dark); color:var(--dark); }
.hist-more button:disabled { opacity:.5; cursor:not-allowed; }
.buy-tag { display:inline-block; border-radius:4px; padding:2px 8px; font-size:0.74rem; font-weight:700; }
.buy-merch { background:#fff3e0; color:#e65100; }
.buy-plan { background:#e8f5e9; color:#2e7d32; }
.buy-reg { background:#ede7f6; color:#4527a0; }
.num-cell { text-align:right; font-variant-numeric:tabular-nums; }
/* 来店履歴の「購入内容」セル */
.hist-body td.buy-cell { white-space:normal; min-width:230px; font-size:0.82rem; }
.buy-line { display:block; padding:1px 0; }
.hist-body tbody tr.has-buy td { background:#fffdf5; }
.hist-body tbody tr.has-buy:hover td { background:#fff8e6; }
/* 調整（値引・追加）セル */
.hist-body td.adj-cell { white-space:normal; min-width:120px; font-size:0.8rem; }
.adj-minus { display:inline-block; background:#fdecea; color:#c62828; border-radius:4px; padding:2px 8px; font-weight:700; }
.adj-plus  { display:inline-block; background:#e8f5e9; color:#2e7d32; border-radius:4px; padding:2px 8px; font-weight:700; }
.adj-note  { display:block; color:var(--sub); font-size:0.76rem; margin-top:2px; }

.dot-loader { display: flex; gap: 4px; }
.dot-loader span { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: bounce .9s infinite; }
.dot-loader span:nth-child(2) { animation-delay: .15s; }
.dot-loader span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1);opacity:1} }

</style>
</head>

<!-- Login Overlay -->
<div id="loginOverlay" style="position:fixed;inset:0;z-index:9999;background:rgba(26,26,26,.95);display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4);">
    <div style="font-size:2rem;margin-bottom:8px;">🧗</div>
    <div style="font-size:1.1rem;font-weight:800;color:#1a1a1a;margin-bottom:4px;">Mono Climbing Studio</div>
    <div style="font-size:0.82rem;color:#777;margin-bottom:24px;">管理システム</div>
    <input type="password" id="loginPass" placeholder="パスワードを入力" style="width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:0.95rem;outline:none;margin-bottom:12px;text-align:center;">
    <button id="loginBtn" style="width:100%;padding:13px;background:#1a1a1a;color:#fff;font-size:0.95rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;">ログイン</button>
    <div id="loginErr" style="margin-top:10px;font-size:0.82rem;color:#c62828;font-weight:600;min-height:18px;"></div>
  </div>
</div>
<script>
(function(){
  var PASS = 'mono';
  if (sessionStorage.getItem('mono_auth') === '1') {
    document.getElementById('loginOverlay').style.display = 'none';
    return;
  }
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  function doLogin(){
    var v = document.getElementById('loginPass').value;
    if (v === PASS) {
      sessionStorage.setItem('mono_auth', '1');
      document.getElementById('loginOverlay').style.display = 'none';
    } else {
      document.getElementById('loginErr').textContent = 'パスワードが正しくありません';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  }
})();
</script>

<script>
var allMembers = [];
var membersLoaded = false;

// ⚡ 速度改善: 会員リストのキャッシュ（入店登録ページと同じ sessionStorage キーを共有）。
//    ページを行き来しても再取得せず、名前検索が待たされない。会員の追加/変更/削除時は破棄する。
var MEM_CACHE_TTL = 4 * 60 * 60 * 1000; // 4時間
function memCacheKey(store){ return 'members_' + store; }
// ⚠ 空リスト([])は「キャッシュなし」として扱い、必ず取り直す。
//   （GASエラー時に空リストが保存されると「会員が見つかりません」が続く不具合になるため）
function _isUsableList(v){ return Array.isArray(v) && v.length > 0; }
function getMemCache(store){
  try {
    var s = sessionStorage.getItem(memCacheKey(store));
    if (!s) return null;
    var d = JSON.parse(s);
    if (Date.now() - d.ts > MEM_CACHE_TTL) { sessionStorage.removeItem(memCacheKey(store)); return null; }
    if (!_isUsableList(d.data)) { sessionStorage.removeItem(memCacheKey(store)); return null; } // 壊れた空キャッシュは破棄
    return d.data;
  } catch(e) { return null; }
}
function setMemCache(store, list){
  try { sessionStorage.setItem(memCacheKey(store), JSON.stringify({ts: Date.now(), data: list})); } catch(e){}
}
function clearMemCache(store){
  try {
    if (store) sessionStorage.removeItem(memCacheKey(store));
    else ['hakata','omura','sasebo'].forEach(function(s){ sessionStorage.removeItem(memCacheKey(s)); });
  } catch(e){}
}
// 会員リストを取得（キャッシュ優先）
function fetchMemberList(store){
  var cached = getMemCache(store);
  if (_isUsableList(cached)) return Promise.resolve(cached);
  return callAPI('getMemberList', {store: store}).then(function(res){
    var list = (res.data && Array.isArray(res.data)) ? res.data : [];
    if (_isUsableList(list)) setMemCache(store, list);
    else clearMemCache(store);   // 取得失敗時は空をキャッシュせず破棄
    return list;
  });
}
// バックグラウンド先読み（画面はブロックしない・失敗は無視）
var _prefetching = {};
function prefetchMembers(store){
  if(!store || _prefetching[store] || getMemCache(store)) return;
  _prefetching[store] = true;
  setTimeout(function(){
    fetchMemberList(store).then(function(){}, function(){});
  }, 50);
}
var STORE_LABEL = {hakata: '博多店', omura: '大村店', sasebo: '佐世保店'};

// GAS が負荷/コールド時に一時的にHTMLエラーページを返すことがあるため、
// 読み取り系のみ自動リトライする（会員の追加/変更/削除は二重実行防止のため対象外）。
var SAFE_RETRY = { getMemberList:1, getMember:1, getMemberHistory:1 };
function _isTransientErr(res){
  if(!res) return true;
  if(res.ok === false){
    var e = String(res.error || '');
    if(e==='GAS_HTML_RESPONSE'||e==='GAS_BAD_JSON'||e==='応答JSONパース失敗'||e==='network') return true;
    if(/timeout|timed out|fetch|network|50[234]/i.test(e)) return true;
  }
  return false;
}
function callAPI(action, params) {
  var maxTry = SAFE_RETRY[action] ? 3 : 1;
  function attempt(n){
    return fetch('/api/gas', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({action: action}, params))
    }).then(function(r){
      return r.text().then(function(t){
        try { return JSON.parse(t); }
        catch(e) {
          return { ok:false, error:'応答JSONパース失敗', data:{ error:'サーバー応答を解釈できませんでした。時間をおいて再実行してください。', raw:(t||'').slice(0,200) } };
        }
      });
    }).catch(function(err){
      return { ok:false, error:'network', data:{ error:'通信エラー: ' + String((err&&err.message)||err) } };
    }).then(function(res){
      if(n < maxTry && _isTransientErr(res)){
        return new Promise(function(rs){ setTimeout(rs, 700*n); }).then(function(){ return attempt(n+1); });
      }
      return res;
    });
  }
  return attempt(1);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  if (code) {

      var m = res.data;
      if (m && m.name) {
        result.className = 'result-box found';

      }
    }).catch(function(e){
      result.className = 'result-box notfound';
      result.textContent = 'エラー: ' + e.message;
    });
  } else {
    var searchFn = function(list) {
      var q = nameQuery.toLowerCase();
      // ③ 会員名が数値等の非文字列でも落ちないよう String() でコアース（博多店の名前検索エラー対策）
      var matches = list.filter(function(m){ return String(m.name == null ? '' : m.name).toLowerCase().indexOf(q) !== -1; });
      if (matches.length === 0) {
        result.className = 'result-box notfound';
        result.textContent = '「' + nameQuery + '」に該当する会員が見つかりません';
      } else {
        result.className = 'result-box found';

            '</div>';
        }).join('') + (matches.length > 15 ? '<div style="color:var(--sub);font-size:.82rem;">他 ' + (matches.length - 15) + ' 件</div>' : '');
        bindHistButtons(result);
      }
    };
    if (allMembers && allMembers.length > 0) {
      searchFn(allMembers);
    } else {
      // ⚡ キャッシュがあれば即時、無ければ取得してキャッシュ
      fetchMemberList(getStore()).then(function(list){
        allMembers = list;
        if (!list.length) {   // 読み込み失敗を「該当なし」と誤表示しない
          result.className = 'result-box notfound';
          result.textContent = '会員リストを読み込めませんでした。もう一度「検索」を押してください。';
          return;
        }
        searchFn(allMembers);
      }).catch(function(e){
        result.className = 'result-box notfound';
        result.textContent = 'エラー: ' + (e && e.message ? e.message : '読み込みに失敗しました');
      });
    }
  }
});

// ⑤⑥ 会員登録：事前重複チェック＋登録＋明確な重複エラー表示
document.getElementById('addBtn').addEventListener('click', function(){
  if (!requireStore()) return;
  var code = document.getElementById('addCode').value.trim();
  var name = document.getElementById('addName').value.trim();
  var self = this;
  var msg = document.getElementById('msgAdd');
  msg.className = 'msg-box'; msg.style.display = 'none';

  // バリデーション
  if (!code) { msg.className='msg-box err'; msg.textContent='会員番号を入力してください'; document.getElementById('addCode').focus(); return; }
  if (!name) { msg.className='msg-box err'; msg.textContent='氏名を入力してください'; document.getElementById('addName').focus(); return; }

  var store = getStore();
  self.disabled = true; self.textContent = '登録中...';

  function resetBtn(){ self.disabled = false; self.textContent = '会員を追加する'; }
  function showDuplicate(existingName) {
    msg.className = 'msg-box err';
    var html = '⚠ 会員番号 <strong>' + esc(code) + '</strong> は' + getStoreLabel() + 'に既に';
    if (existingName) html += '「<strong>' + esc(existingName) + '</strong>」として';
    html += '登録されています。別の番号を使用してください。';
    msg.innerHTML = html;
    msg.style.display = 'block';
    document.getElementById('addCode').focus();
    document.getElementById('addCode').select();
  }

  // ⑥ 事前重複チェック（同じ店舗内のみ）
  callAPI('getMember', {code: code, store: store}).then(function(chk){
    // chk = { ok: true, data: {code,name,store} | null }
    var existing = chk && chk.ok && chk.data;
    if (existing && existing.name) {
      resetBtn();
      showDuplicate(existing.name);
      return;
    }
    // 新規登録実行
    return callAPI('addMember', {code: code, name: name, store: store}).then(function(res){
      resetBtn();
      var data = (res && res.data) || {};
      var errMsg = data.error || (res && res.error) || '';
      if (res && res.ok && data.success === true) {
        // 成功
        msg.className = 'msg-box ok';
        msg.textContent = '✓ ' + getStoreLabel() + ' に登録しました（' + code + ' / ' + name + '）';
        msg.style.display = 'block';
        document.getElementById('addCode').value = '';
        document.getElementById('addName').value = '';
        // ⚡ 会員リストのキャッシュを破棄（登録内容を必ず最新で取り直す）
        clearMemCache(store);
        // キャッシュ不整合を避けるため allMembers にも即時追加
        allMembers.push({code: String(code), name: name, joinDate: '', store: getStoreLabel()});
        setMemCache(store, allMembers);
        // 会員一覧が既に表示されていれば更新
        if (membersLoaded) loadMembers();
      } else if (errMsg && /(duplicate|重複|already|既に|すでに|登録済|登録されて)/i.test(errMsg)) {
        // ⑥ 重複エラー（バックエンド側で検出された場合）
        showDuplicate('');
      } else {
        msg.className = 'msg-box err';
        msg.textContent = 'エラー: ' + (errMsg || '登録に失敗しました（応答: ' + JSON.stringify(res) + '）');
        msg.style.display = 'block';
      }
    });
  }).catch(function(e){
    resetBtn();
    msg.className = 'msg-box err';
    msg.textContent = '通信エラー: ' + (e && e.message ? e.message : e);
    msg.style.display = 'block';
  });
});

// ⑬+⑯ 会員番号 昇順/降順 切替
//   会員番号は文字列保存だが、可能なら数値として比較。先頭ゼロ等の表記揺れにも対応するため
//   pure-numeric は数値比較、それ以外は localeCompare(numeric:true) でナチュラル順
var memberSortDir = 'asc'; // 'asc' | 'desc'
function sortMembersInPlace(list, dir) {
  var mul = (dir === 'desc') ? -1 : 1;
  list.sort(function(a, b){
    var ac = String(a.code || ''), bc = String(b.code || '');
    var an = Number(ac), bn = Number(bc);
    var aIsNum = ac !== '' && !isNaN(an);
    var bIsNum = bc !== '' && !isNaN(bn);
    if (aIsNum && bIsNum) return mul * (an - bn);
    if (aIsNum) return mul * -1;
    if (bIsNum) return mul * 1;
    return mul * ac.localeCompare(bc, undefined, { numeric: true, sensitivity: 'base' });
  });
}
(function setupSortToggle(){
  var btn = document.getElementById('sortToggleBtn');
  if (!btn) return;
  function refreshBtnLabel(){
    btn.textContent = '会員番号 ' + (memberSortDir === 'asc' ? '↑' : '↓');
    btn.title = '会員番号 ' + (memberSortDir === 'asc' ? '昇順' : '降順') + '（クリックで切替）';
  }
  refreshBtnLabel();
  btn.addEventListener('click', function(){
    memberSortDir = (memberSortDir === 'asc') ? 'desc' : 'asc';
    refreshBtnLabel();
    if (membersLoaded && allMembers.length) {
      sortMembersInPlace(allMembers, memberSortDir);
      // フィルタ適用中なら再フィルタ、未適用なら全件再表示
      var q = (document.getElementById('listFilter').value || '').trim().toLowerCase();
      if (q) {
        var filtered = allMembers.filter(function(m){
          return String(m.code).toLowerCase().includes(q) || String(m.name||'').toLowerCase().includes(q);
        });
        renderMemberTable(filtered);
      } else {
        renderMemberTable(allMembers);
      }
    }
  });
})();

function renderMemberTable(members){
  var wrap = document.getElementById('memberTableWrap');

  count.textContent = getStoreLabel() + '  ' + members.length + ' 名';
  if (!members.length) {
    wrap.innerHTML = '<div class="empty-state">' + getStoreLabel() + ' の会員データがありません</div>';
    return;
  }
  var html = '<table><thead><tr><th>会員番号</th><th>氏名</th><th>登録日</th><th>操作</th></tr></thead><tbody>';
  members.forEach(function(m){
    var code = esc(String(m.code));
    var name = esc(m.name || '');
    html += '<tr>' +
      '<td class="code-cell">' + code + '</td>' +
      '<td>' + name + '</td>' +
      '<td style="color:var(--sub);font-size:.82rem;">' + esc(m.joinDate || '') + '</td>' +
      '<td><div class="row-actions">' +
        '<button class="row-hist-btn" data-code="' + code + '" data-name="' + name + '">履歴</button>' +
        '<button class="row-edit-btn" data-code="' + code + '" data-name="' + name + '">編集</button>' +
        '<button class="row-del-btn" data-code="' + code + '" data-name="' + name + '">削除</button>' +
      '</div></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.row-hist-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openHistoryModal(this.dataset.code, this.dataset.name);
    });
  });

  wrap.querySelectorAll('.row-edit-btn').forEach(function(btn){
    btn.addEventListener('click', function(){

  });

  wrap.querySelectorAll('.row-del-btn').forEach(function(btn){

}

  histState.loading = true;
  callAPI('getMemberHistory', { store: histState.store, code: histState.code, limit: histState.limit, offset: histState.offset })
  .then(function(res){
    histState.loading = false;
    if(!res.ok || !res.data){
      var em = (res.data && res.data.error) ? res.data.error : (res.error || '履歴を読み込めませんでした');
      document.getElementById('histBody').innerHTML = '<div class="empty-state" style="color:#c62828">エラー: ' + esc(em) + '</div>';
      return;
    }
    var d = res.data;
    histState.summary = d;
    histState.hasMore = !!d.hasMore;
    histState.entries = append ? histState.entries.concat(d.entries||[]) : (d.entries||[]);
    histState.offset = histState.entries.length;
    if(d.name && !histState.name){ histState.name = d.name; document.getElementById('histName').textContent = d.name; }
    renderSummary(d);
    renderHistory();
  });
}

function renderSummary(d){
  document.getElementById('histSummary').innerHTML =
    '<div class="hs-item"><div class="hs-label">来店記録</div><div class="hs-value">' + (d.totalRecords||0) + ' 回</div></div>' +
    '<div class="hs-item"><div class="hs-label">初回来店</div><div class="hs-value" style="font-size:.9rem;">' + esc(d.firstDate||'—') + '</div></div>' +
    '<div class="hs-item"><div class="hs-label">最終来店</div><div class="hs-value" style="font-size:.9rem;">' + esc(d.lastDate||'—') + '</div></div>' +
    '<div class="hs-item"><div class="hs-label">累計お支払い</div><div class="hs-value">' + yen(d.sumTotal) + '</div></div>' +
    '<div class="hs-item"><div class="hs-label">うち物販</div><div class="hs-value">' + yen(d.sumMerch) + '</div></div>';
  var plans = d.topPlans || [];
  document.getElementById('histPlans').innerHTML = plans.length
    ? 'よく使うプラン： ' + plans.map(function(p){ return '<span class="pl-tag">' + esc(p.label) + ' ' + p.count + '回</span>'; }).join('')
    : '';
}

function isPlanPurchase(pl){
  pl = String(pl||'');
  if(!pl) return false;
  if(/利用$/.test(pl)) return false; // 月パス利用・回数券利用などは「購入」ではない
  return /月パス|回数券|半年|スクール月謝|スクール入会金/.test(pl);
}
// その他調整（値引き・追加）のセル。マイナス＝値引き、プラス＝追加。備考(adjustNote)も表示。
function adjCell(e){
  var adj = Number(e.adjustment) || 0;
  var note = String(e.adjustNote || '').trim();
  if(!adj && !note) return '<span style="color:var(--sub);">—</span>';
  var html = '';
  if(adj){
    html += '<span class="' + (adj < 0 ? 'adj-minus' : 'adj-plus') + '">' +
            (adj < 0 ? '値引 −' : '追加 ＋') + yen(Math.abs(adj)) + '</span>';
  }
  if(note) html += '<span class="adj-note">' + esc(note) + '</span>';
  return html;
}
function purchaseItems(e){
  var items = [];
  if(e.regFee > 0) items.push({date:e.date, kind:'登録料', cls:'buy-reg', name:'登録料', amount:e.regFee, payment:e.payment});
  if(isPlanPurchase(e.planLabel)) items.push({date:e.date, kind:'プラン', cls:'buy-plan', name:e.planLabel, amount:e.usageFee, payment:e.payment});
  if(e.merchAmt > 0) items.push({date:e.date, kind:'物販', cls:'buy-merch', name:(e.merchNote||'物販'), amount:e.merchAmt, payment:e.payment, discount:e.merchDiscount});
  return items;
}

function renderHistory(){
  var body = document.getElementById('histBody');
  var entries = histState.entries || [];
  if(!entries.length){ body.innerHTML = '<div class="empty-state">この会員の来店記録はまだありません</div>'; return; }
  var html;
  if(histState.tab === 'visit'){
    // 来店履歴に購入内容（物販・プラン購入・登録料）も表示する
    html = '<table><thead><tr><th>日付</th><th>入店</th><th>利用プラン</th><th class="num-cell">利用料</th><th>レンタル</th><th>購入内容（物販・プラン・登録料）</th><th>調整（値引・追加）</th><th class="num-cell">合計</th><th>支払方法</th></tr></thead><tbody>' +
      entries.map(function(e){
        var items = purchaseItems(e);
        var buyCell = items.length
          ? items.map(function(it){
              var nm = (it.kind === 'プラン') ? '' : (' ' + esc(it.name));   // プラン名は左の「利用プラン」列と重複するので省略
              return '<span class="buy-line"><span class="buy-tag ' + it.cls + '">' + esc(it.kind) + '</span>' + nm +
                     ' <strong>' + yen(it.amount) + '</strong>' +
                     (it.discount ? ' <span style="color:#c62828;font-size:.76rem;">(値引 −' + yen(it.discount) + ')</span>' : '') +
                     '</span>';
            }).join('')
          : '<span style="color:var(--sub);">—</span>';
        return '<tr class="' + (items.length ? 'has-buy' : '') + '">' +
          '<td>' + esc(e.date) + '</td>' +
          '<td style="color:var(--sub);">' + esc(e.entryTime||'') + '</td>' +
          '<td>' + esc(e.planLabel||'') + '</td>' +
          '<td class="num-cell">' + (e.usageFee ? yen(e.usageFee) : '—') + '</td>' +
          '<td style="color:var(--sub);font-size:.8rem;">' + esc(e.rentalNote||'') + (e.rentalFee ? '（' + yen(e.rentalFee) + '）' : '') + '</td>' +
          '<td class="buy-cell">' + buyCell + '</td>' +
          '<td class="adj-cell">' + adjCell(e) + '</td>' +
          '<td class="num-cell" style="font-weight:700;">' + yen(e.total) + '</td>' +
          '<td style="color:var(--sub);font-size:.8rem;">' + esc(e.payment||'') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  } else {
    var items = [];
    entries.forEach(function(e){ items = items.concat(purchaseItems(e)); });
    if(!items.length){
      html = '<div class="empty-state">表示中の期間に購入の記録はありません（物販・月パス・回数券・登録料など）</div>';
    } else {
      html = '<table><thead><tr><th>日付</th><th>種別</th><th>内容</th><th class="num-cell">金額</th><th>支払方法</th></tr></thead><tbody>' +
        items.map(function(it){
          return '<tr>' +
            '<td>' + esc(it.date) + '</td>' +
            '<td><span class="buy-tag ' + it.cls + '">' + esc(it.kind) + '</span></td>' +
            '<td>' + esc(it.name) + (it.discount ? ' <span style="color:#c62828;font-size:.78rem;">（値引 −' + yen(it.discount) + '）</span>' : '') + '</td>' +
            '<td class="num-cell" style="font-weight:700;">' + yen(it.amount) + '</td>' +
            '<td style="color:var(--sub);font-size:.8rem;">' + esc(it.payment||'') + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table>';
    }
  }
  html += '<div class="hist-more">' +
    (histState.hasMore
      ? '<button id="histMoreBtn">もっと見る（さらに過去' + histState.limit + '件）</button>'
      : '<span style="color:var(--sub);font-size:.82rem;">これ以上の記録はありません（表示中 ' + entries.length + ' 件）</span>') +
    '</div>';
  body.innerHTML = html;
  var more = document.getElementById('histMoreBtn');
  if(more){
    more.addEventListener('click', function(){
      more.disabled = true; more.textContent = '読み込み中...';
      loadHistory(true);
    });
  }
}

// Filter
document.getElementById('listFilter').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  if (!q) { renderMemberTable(allMembers); return; }
  var filtered = allMembers.filter(function(m){
    return String(m.code).toLowerCase().includes(q) || String(m.name||'').toLowerCase().includes(q);
  });
  renderMemberTable(filtered);
});

// Reload button
document.getElementById('reloadBtn').addEventListener('click', function(){
  document.getElementById('listFilter').value = '';
  loadMembers();
});

</script>
</body>
</html>
